services:
  pipeline:
    build: { context: ., dockerfile: Dockerfile.pipeline }
    volumes:
      - ./data:/srv/data      # drop new monthly CSVs into data/raw/
      - ./reports:/srv/reports
      - ./models:/srv/models
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["5000:5000"]
    volumes:
      - ./data:/srv/data
      - ./reports:/srv/reports
      - ./models:/srv/models
    depends_on: [pipeline]
    restart: unless-stopped
